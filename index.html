<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo List</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: radial-gradient(ellipse at top, #1b2a5e 0%, #0a1030 60%, #050818 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #e2e8f0;
    }

    .todo {
      width: 100%;
      max-width: 520px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(148, 163, 184, 0.25);
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(8px);
      overflow: hidden;
    }

    header {
      padding: 24px 24px 16px;
      border-bottom: 1px solid rgba(148, 163, 184, 0.15);
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: 1px;
      background: linear-gradient(90deg, #ff4e50, #ffd700, #38bdf8, #c084fc);
      background-size: 300% auto;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shine 6s linear infinite;
    }

    @keyframes shine {
      to { background-position: 300% center; }
    }

    .subtitle {
      margin-top: 4px;
      font-size: 0.85rem;
      color: #94a3b8;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .add-form {
      display: flex;
      gap: 10px;
      padding: 16px 24px;
    }

    .add-form input {
      flex: 1;
      padding: 12px 14px;
      border: 1px solid rgba(148, 163, 184, 0.3);
      border-radius: 10px;
      background: rgba(30, 41, 59, 0.8);
      color: #f1f5f9;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .add-form input::placeholder {
      color: #64748b;
    }

    .add-form input:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
    }

    .add-form button {
      padding: 12px 20px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #38bdf8, #6366f1);
      color: #fff;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s, filter 0.2s;
    }

    .add-form button:hover {
      filter: brightness(1.15);
      transform: translateY(-1px);
    }

    .add-form button:active {
      transform: translateY(0);
    }

    ul {
      list-style: none;
      max-height: 50vh;
      overflow-y: auto;
      padding: 8px 16px;
    }

    ul::-webkit-scrollbar {
      width: 8px;
    }

    ul::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, 0.3);
      border-radius: 4px;
    }

    li {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 8px;
      border-radius: 10px;
      transition: background 0.2s;
      animation: slideIn 0.25s ease;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    li:hover {
      background: rgba(56, 189, 248, 0.08);
    }

    li input[type="checkbox"] {
      width: 20px;
      height: 20px;
      accent-color: #38bdf8;
      cursor: pointer;
      flex-shrink: 0;
    }

    li span {
      flex: 1;
      word-break: break-word;
      transition: color 0.2s, text-decoration-color 0.2s;
    }

    li.done span {
      color: #64748b;
      text-decoration: line-through;
      text-decoration-color: #64748b;
    }

    li .del {
      border: none;
      background: transparent;
      color: #ef4444;
      font-size: 1.2rem;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.2s, transform 0.15s;
      padding: 4px 6px;
      line-height: 1;
    }

    li:hover .del,
    li:focus-within .del {
      opacity: 1;
    }

    li .del:hover {
      transform: scale(1.25);
    }

    .empty {
      padding: 24px;
      text-align: center;
      color: #64748b;
      font-style: italic;
    }

    footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 24px;
      border-top: 1px solid rgba(148, 163, 184, 0.15);
      font-size: 0.85rem;
      color: #94a3b8;
    }

    .filters {
      display: flex;
      gap: 6px;
    }

    .filters button {
      padding: 5px 12px;
      border: 1px solid rgba(148, 163, 184, 0.3);
      border-radius: 999px;
      background: transparent;
      color: #94a3b8;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .filters button:hover {
      border-color: #38bdf8;
      color: #38bdf8;
    }

    .filters button.active {
      background: rgba(56, 189, 248, 0.15);
      border-color: #38bdf8;
      color: #38bdf8;
    }

    .clear {
      border: none;
      background: transparent;
      color: #94a3b8;
      font-size: 0.8rem;
      cursor: pointer;
      text-decoration: underline;
      transition: color 0.2s;
    }

    .clear:hover {
      color: #ef4444;
    }
  </style>
</head>
<body>
  <div class="todo">
    <header>
      <h1>Todo List</h1>
      <div class="subtitle">Список задач</div>
    </header>

    <form class="add-form" id="addForm">
      <input type="text" id="newTodo" placeholder="Добавить новую задачу..." autocomplete="off" maxlength="200">
      <button type="submit" title="Добавить">+</button>
    </form>

    <ul id="list"></ul>
    <div class="empty" id="empty" hidden>Пока пусто. Добавьте первую задачу!</div>

    <footer>
      <span id="counter">0 задач</span>
      <div class="filters">
        <button type="button" data-filter="all" class="active">Все</button>
        <button type="button" data-filter="active">Активные</button>
        <button type="button" data-filter="done">Готовые</button>
      </div>
      <button type="button" class="clear" id="clearDone">Очистить готовые</button>
    </footer>
  </div>

  <script>
    const STORAGE_KEY = 'todo-list';
    const form = document.getElementById('addForm');
    const input = document.getElementById('newTodo');
    const list = document.getElementById('list');
    const empty = document.getElementById('empty');
    const counter = document.getElementById('counter');
    const clearBtn = document.getElementById('clearDone');
    const filterBtns = document.querySelectorAll('.filters button');

    let todos = [];
    let filter = 'all';

    try {
      todos = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    } catch {
      todos = [];
    }

    function save() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
    }

    function pluralize(n) {
      const mod10 = n % 10;
      const mod100 = n % 100;
      if (mod10 === 1 && mod100 !== 11) return 'задача';
      if (mod10 >= 2 && mod10 <= 4 && (mod100 < 10 || mod100 >= 20)) return 'задачи';
      return 'задач';
    }

    function render() {
      const visible = todos.filter(t => {
        if (filter === 'active') return !t.done;
        if (filter === 'done') return t.done;
        return true;
      });

      list.innerHTML = '';
      visible.forEach(t => {
        const li = document.createElement('li');
        if (t.done) li.classList.add('done');

        const cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.checked = t.done;
        cb.addEventListener('change', () => {
          t.done = cb.checked;
          save();
          render();
        });

        const span = document.createElement('span');
        span.textContent = t.text;

        const del = document.createElement('button');
        del.className = 'del';
        del.textContent = '✕';
        del.title = 'Удалить';
        del.addEventListener('click', () => {
          todos = todos.filter(x => x.id !== t.id);
          save();
          render();
        });

        li.append(cb, span, del);
        list.appendChild(li);
      });

      empty.hidden = visible.length > 0;

      const active = todos.filter(t => !t.done).length;
      counter.textContent = `${active} ${pluralize(active)}`;

      clearBtn.style.visibility = todos.some(t => t.done) ? 'visible' : 'hidden';
    }

    form.addEventListener('submit', e => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      todos.push({ id: Date.now(), text, done: false });
      input.value = '';
      save();
      render();
      input.focus();
    });

    clearBtn.addEventListener('click', () => {
      todos = todos.filter(t => !t.done);
      save();
      render();
    });

    filterBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        filter = btn.dataset.filter;
        filterBtns.forEach(b => b.classList.toggle('active', b === btn));
        render();
      });
    });

    render();
  </script>
</body>
</html>
